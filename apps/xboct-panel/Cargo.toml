[package]
name = "xboct-panel"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ku6epXBOCTuK/brul"

[lints]
workspace = true

[[bin]]
name = "xboct-panel"
path = "src/main.rs"

[dependencies]
brul = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = { workspace = true }

[build-dependencies]
brul = { workspace = true }
embed-manifest = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
