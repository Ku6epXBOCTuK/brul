[package]
name = "brul"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ku6epXBOCTuK/brul"

[lints]
workspace = true

[dependencies]
brul-codegen = { workspace = true }
brul-gui = { workspace = true }
brul-macros = { workspace = true }
brul-reactive = { workspace = true }
brul-script = { workspace = true }
brul-style = { workspace = true }
brul-syntax = { workspace = true }
brul-window = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "each"
harness = false

[[bench]]
name = "read"
harness = false

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.lints.clippy]
non_ascii_literal = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
brul-codegen = { path = 'crates\brul-codegen' }
brul-gui = { path = 'crates\brul-gui' }
brul-macros = { path = 'crates\brul-macros' }
brul-reactive = { path = 'crates\brul-reactive' }
brul-script = { path = 'crates\brul-script' }
brul-style = { path = 'crates\brul-style' }
brul-syntax = { path = 'crates\brul-syntax' }
brul-window = { path = 'crates\brul-window' }
cosmic-text = "0.19.0"
criterion = { version = "0.8.2", default-features = false }
image = { version = "0.25.10", default-features = false }
pest = "2.9.5"
pest_derive = "2.9.5"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = "1.0.228"
syn = { version = "2.0.119", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3"
wgpu = "30.0.1"
winit = "=0.31.0-beta.4"
winreg = "0.56.0"
brul = { path = "" }
resvg = { version = "0.50.0", default-features = false }
