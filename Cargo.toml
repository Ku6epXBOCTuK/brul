[package]
name = "brul"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ku6epXBOCTuK/brul"

[lints]
workspace = true

[dependencies]
brul-codegen = { workspace = true }
brul-ident = { workspace = true }
brul-gui = { workspace = true }
brul-gpu = { workspace = true }
brul-macros = { workspace = true }
brul-reactive = { workspace = true }
brul-script = { workspace = true }
brul-style = { workspace = true }
brul-syntax = { workspace = true }
brul-video = { workspace = true }
brul-window = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
brul-lang-gen = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "each"
harness = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "dpi"
harness = false

[[bench]]
name = "paint"
harness = false

[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.lints.clippy]
non_ascii_literal = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
brul-case = { path = 'crates\brul-case' }
brul-command = { path = 'crates\brul-command' }
brul-codegen = { path = 'crates\brul-codegen' }
brul-gpu = { path = 'crates\brul-gpu' }
brul-gui = { path = 'crates\brul-gui' }
brul-ident = { path = 'crates\brul-ident' }
brul-layout = { path = 'crates\brul-layout' }
brul-lang-gen = { path = 'crates\brul-lang-gen' }
brul-lang-schema = { path = 'crates\brul-lang-schema' }
brul-macros = { path = 'crates\brul-macros' }
brul-reactive = { path = 'crates\brul-reactive' }
brul-script = { path = 'crates\brul-script' }
brul-style = { path = 'crates\brul-style' }
brul-style-gen = { path = 'crates\brul-style-gen' }
brul-style-schema = { path = 'crates\brul-style-schema' }
brul-syntax = { path = 'crates\brul-syntax' }
brul-video = { path = 'crates\brul-video' }
brul-window = { path = 'crates\brul-window' }
brul-widget-gen = { path = 'crates\brul-widget-gen' }
brul-widget-schema = { path = 'crates\brul-widget-schema' }
cosmic-text = "0.19.0"
criterion = { version = "0.8.2", default-features = false }
heck = "0.5.0"
image = { version = "0.25.10", default-features = false }
material-colors = "0.5.0"
pest = "2.9.5"
pest_derive = "2.9.5"
prettyplease = "0.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
taffy = "0.15.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3"
wgpu = "30.0.1"
winit = "=0.31.0-beta.4"
brul = { path = "" }
resvg = { version = "0.50.0", default-features = false }
softbuffer = "0.4.8"
naga = "30.0.1"
